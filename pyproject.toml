[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-pptx2markdown"
version = "0.1.0"
description = "LangChain document loader for deterministic, structure-aware PowerPoint parsing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4"
authors = [{ name = "MoonYoung02", email = "happy518596@gmail.com" }]
maintainers = [{ name = "MoonYoung02", email = "happy518596@gmail.com" }]
keywords = ["langchain", "pptx", "powerpoint", "document-loader", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=1.0,<2",
    "pptx2markdown>=0.2.0,<1",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "mypy>=1.11",
    "python-pptx>=1.0",
    "ruff>=0.9",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/PPTX2Markdown/langchain-pptx2markdown"
Repository = "https://github.com/PPTX2Markdown/langchain-pptx2markdown"
Issues = "https://github.com/PPTX2Markdown/langchain-pptx2markdown/issues"
Changelog = "https://github.com/PPTX2Markdown/langchain-pptx2markdown/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_pptx2markdown"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["langchain_pptx2markdown"]
