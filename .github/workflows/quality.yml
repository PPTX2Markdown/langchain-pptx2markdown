name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install unreleased core parser
        run: python -m pip install "pptx2markdown>=0.2.0,<1"
      - name: Install integration and test tools
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m unittest discover -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install "pptx2markdown>=0.2.0,<1" -e ".[test]"
      - run: ruff check src tests benchmarks
      - run: ruff format --check src tests benchmarks
      - run: mypy src
      - run: python -m build
      - run: python -m twine check dist/*

  dependency-bounds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        requirement: ["langchain-core==1.0.*", "langchain-core<2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install "pptx2markdown>=0.2.0,<1" "${{ matrix.requirement }}" -e . --no-deps
      - run: python -m unittest discover -v
